<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#9f1239" />
    <meta
      name="description"
      content="Le Crimson — a personalised news reader with interests, search, saved stories and a community feed."
    />
    <title>Le Crimson — news, tuned to you</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("lecrimson:theme");
        const dark = t ? t === '"dark"' : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
